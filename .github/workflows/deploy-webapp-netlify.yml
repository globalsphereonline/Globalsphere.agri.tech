name: Deploy Webapp (Netlify)

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install webapp deps
        working-directory: webapp
        run: npm ci
      - name: Build webapp
        working-directory: webapp
        env:
          VITE_API_BASE: ${{ secrets.WEBAPP_VITE_API_BASE }}
        run: npm run build
      - name: Deploy to Netlify
        uses: netlify/actions/cli@v4
        with:
          args: deploy --dir=webapp/dist --prod --site ${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}