name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ '**' ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build all workspaces
        run: npm run build

      - name: Start backend and verify health
        run: |
          node backend/server.js & echo $! > server.pid
          # wait for server
          sleep 3
          echo "Health:" && curl -sS http://localhost:4000/api/health || true
        timeout-minutes: 2

      - name: Stop backend
        if: always()
        run: |
          if [ -f server.pid ]; then kill $(cat server.pid) || true; fi

      - name: Upload webapp dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist
          if-no-files-found: ignore